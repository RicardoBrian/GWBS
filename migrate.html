  <button onclick="document.getElementById('log').innerHTML=''">로그 지우기</button>

      { date: "2026. 4. 8",   period: "아침방송",  p3: "안정후",  p2: "김미선",                    p1: "김원혜, 지서연",            url: "https://www.youtube.com/watch?v=_xKrVxnd8G8",    notice: "" },

      { date: "2026. 5. 13",  period: "아침방송",  p3: "진성민",  p2: "김미림, 권희민",            p1: "이원혜, 박아리나",          url: "[방학 중 생활안전] 07. 도박예방교육(동동이와 송송이의 슬기로운 방학생활)  ♥활동지 하단링크♥",    notice: "7분 영상, 조금 빨리 시작해주세요~" },

      { date: "2026. 6. 10",  period: "아침방송",  p3: "주선미",  p2: "김미림",                    p1: "박시문, 이원혜",            url: "https://www.youtube.com/watch?v=joFjb0GWxwo",    notice: "" },

      { date: "2026. 6. 24",  period: "아침방송",  p3: "방하은",  p2: "김미선",                    p1: "김유진, 김원혜",            url: "https://www.youtube.com/watch?v=Q6txMi-40aQ",    notice: "" },
      { date: "2026. 7. 1",   period: "아침방송",  p3: "서경은",  p2: "황소휘, 김미림",            p1: "지서연, 박시문",            url: "https://www.youtube.com/watch?v=k_OC_vGJsuY",    notice: "" },
      { date: "2026. 7. 8",   period: "아침방송",  p3: "주선미",  p2: "권희민",                    p1: "이원혜, 박아리나",          url: "https://www.youtube.com/watch?v=z0ot4GzDQQI",    notice: "" },
      { date: "2026. 7. 15",  period: "아침방송",  p3: "진성민",  p2: "윤단월, 김미선",            p1: "류운희, 김유진",            url: "https://www.youtube.com/watch?v=tGm20Ey0asM",    notice: "" },
      { date: "2026. 7. 22",  period: "아침방송",  p3: "서경은",  p2: "황소휘, 김미림",            p1: "박시문, 이원혜",            url: "",    notice: "" },
    ];

    function parseDate(raw) {
      raw = raw.trim();
      // "2026. 3. 16" → "2026-03-16"
      const m1 = raw.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
      if (m1) return `${m1[1]}-${m1[2].padStart(2,'0')}-${m1[3].padStart(2,'0')}`;
      // "2026-05-11" 형식은 그대로
      const m2 = raw.match(/(\d{4})-(\d{2})-(\d{2})/);
      if (m2) return raw;
      return null;
    }

    function formatDisplayDate(dateKey) {
      const days = ['일','월','화','수','목','금','토'];
      const d = new Date(dateKey + 'T00:00:00');
      return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
    }

    function log(msg, cls = '') {
      const el = document.getElementById('log');
      const span = cls ? `<span class="${cls}">${msg}</span>` : msg;
      el.innerHTML += span + '\n';
      el.scrollTop = el.scrollHeight;
    }

    async function runMigration() {
      document.getElementById('btnRun').disabled = true;
      document.getElementById('log').innerHTML = '';
      log('마이그레이션 시작...\n', 'info');

      // 날짜별로 그룹핑
      const grouped = {};
      RAW_ROWS.forEach(row => {
        const dateKey = parseDate(row.date);
        if (!dateKey) { log(`  날짜 파싱 실패: ${row.date}`, 'err'); return; }
        if (!grouped[dateKey]) {
          grouped[dateKey] = { date: formatDisplayDate(dateKey), dateValue: dateKey, tasks: [] };
        }
        grouped[dateKey].tasks.push({
          id: 'task_' + dateKey + '_' + row.period.replace(/\s/g,''),
          period: row.period,
          p3: row.p3,
          p2: row.p2,
          p1: row.p1,
          rawVideoUrl: row.url,
          notice: row.notice
        });
      });

      const dateKeys = Object.keys(grouped).sort();
      log(`총 날짜 수: ${dateKeys.length}개`, 'info');
      log(`총 일정 수: ${RAW_ROWS.length}건\n`, 'info');

      let successCount = 0;
      let errorCount = 0;

      for (const dateKey of dateKeys) {
        const docData = grouped[dateKey];
        try {
          await db.collection('broadcasts').doc(dateKey).set(docData);
          log(`  ✅ ${docData.date} (${docData.tasks.length}개 교시) → 업로드 완료`, 'ok');
          successCount++;
        } catch(e) {
          log(`  ❌ ${docData.date} → 오류: ${e.message}`, 'err');
          errorCount++;
        }
      }

      log(`\n완료! 성공 ${successCount}건 / 실패 ${errorCount}건`, errorCount > 0 ? 'err' : 'ok');
      log('\n마이그레이션이 끝났습니다. 이 페이지는 삭제해도 됩니다.', 'info');
      document.getElementById('btnRun').disabled = false;
    }
  </script>
</body>
</html>
